<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PayNest Support Assistant</title>
  <style>
    :root {
      --bg: #f6f7f9; --card: #ffffff; --ink: #1b2430; --muted: #5b6675;
      --accent: #0b7a75; --user: #0b7a75; --user-ink: #ffffff; --border: #e2e5ea; --error: #b3261e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11161d; --card: #1a212b; --ink: #e8ecf1; --muted: #9aa6b5;
        --accent: #4fd1c5; --user: #0f766e; --user-ink: #ffffff; --border: #2b3441; --error: #ff8a80;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
    main { max-width: 720px; margin: 0 auto; padding: 24px 16px 40px; display: flex; flex-direction: column; min-height: 100vh; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    h1 { font-size: 1.3rem; margin: 0; }
    .status { font-size: 0.85rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
    .dot.ok { background: #2e9e5b; } .dot.bad { background: var(--error); }
    #log { flex: 1; margin: 20px 0; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 85%; padding: 12px 14px; border-radius: 14px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; }
    .msg.user { align-self: flex-end; background: var(--user); color: var(--user-ink); border-bottom-right-radius: 4px; }
    .msg.bot { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .msg.error { align-self: flex-start; background: transparent; border: 1px solid var(--error); color: var(--error); }
    .meta { margin-top: 8px; font-size: 0.8rem; color: var(--muted); }
    details { margin-top: 8px; font-size: 0.85rem; color: var(--muted); }
    details ul { margin: 6px 0 0; padding-left: 18px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip { font: inherit; font-size: 0.85rem; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--ink); cursor: pointer; }
    .chip:hover { border-color: var(--accent); }
    form { display: flex; gap: 8px; }
    input[type=text] { flex: 1; font: inherit; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--ink); }
    button.send { font: inherit; font-weight: 600; padding: 12px 20px; border-radius: 12px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .settings { margin-top: 16px; font-size: 0.85rem; color: var(--muted); }
    .settings input { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--ink); }
  </style>
</head>
<body>
<main>
  <header>
    <h1>PayNest Support Assistant</h1>
    <div class="status"><span id="dot" class="dot"></span><span id="status">checking...</span></div>
  </header>

  <div id="log" aria-live="polite"></div>

  <div class="chips" id="chips"></div>
  <form id="form">
    <input type="text" id="question" placeholder="Ask about transfers, cards, refunds..." maxlength="300" autocomplete="off" required>
    <button class="send" id="send" type="submit">Ask</button>
  </form>

  <details class="settings">
    <summary>Settings</summary>
    <p>API key (only needed if the server has API_KEY set; kept for this browser tab only):
      <input type="password" id="apikey" autocomplete="off"></p>
  </details>
</main>

<script>
  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("question");
  const sendBtn = document.getElementById("send");
  const apiKeyInput = document.getElementById("apikey");

  const SUGGESTIONS = [
    "How long do instant transfers take?",
    "How do I freeze a lost card?",
    "What do I need for identity verification?",
    "What is the card replacement fee?"
  ];

  apiKeyInput.value = sessionStorage.getItem("apiKey") || "";
  apiKeyInput.addEventListener("input", () => sessionStorage.setItem("apiKey", apiKeyInput.value));

  // All text is inserted with textContent, never innerHTML: model output is untrusted.
  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.textContent = text;
    log.appendChild(div);
    div.scrollIntoView({ behavior: "smooth", block: "end" });
    return div;
  }

  function addSources(bubble, data) {
    // Do not show sources next to a "can't find that" answer: they would be unrelated facts.
    const abstained = data.answer.includes("can't find that");
    if (data.sources && data.sources.length && !abstained) {
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      summary.textContent = "Sources (" + data.sources.length + ")";
      const ul = document.createElement("ul");
      data.sources.forEach((s) => {
        const li = document.createElement("li");
        li.textContent = s;
        ul.appendChild(li);
      });
      details.append(summary, ul);
      bubble.appendChild(details);
    }
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = Math.round(data.latency_ms) + " ms · " + data.mode;
    bubble.appendChild(meta);
  }

  async function ask(question) {
    const headers = { "Content-Type": "application/json" };
    const key = sessionStorage.getItem("apiKey");
    if (key) headers["X-API-Key"] = key;
    const res = await fetch("/ask", { method: "POST", headers, body: JSON.stringify({ question }) });
    if (res.status === 401) throw new Error("Invalid or missing API key. Add it under Settings.");
    if (res.status === 422) throw new Error("Please enter a question of 3 to 300 characters.");
    if (res.status === 503) throw new Error("The assistant is temporarily unavailable. Please try again shortly.");
    if (!res.ok) throw new Error("Request failed (" + res.status + ").");
    return res.json();
  }

  async function submit(question) {
    addMessage("user", question);
    sendBtn.disabled = true;
    const pending = addMessage("bot", "Thinking...");
    try {
      const data = await ask(question);
      pending.textContent = data.answer;
      addSources(pending, data);
    } catch (err) {
      pending.remove();
      addMessage("error", err.message);
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;
    input.value = "";
    submit(q);
  });

  const chips = document.getElementById("chips");
  SUGGESTIONS.forEach((text) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = text;
    b.addEventListener("click", () => submit(text));
    chips.appendChild(b);
  });

  fetch("/health").then((r) => r.json()).then((h) => {
    document.getElementById("dot").classList.add("ok");
    document.getElementById("status").textContent = "online · " + h.mode;
  }).catch(() => {
    document.getElementById("dot").classList.add("bad");
    document.getElementById("status").textContent = "offline";
  });
</script>
</body>
</html>
